<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - AI Career System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            AI Career System
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        </div>

    </nav>


    <section class="hero">

        <h1>Create Your Account</h1>

        <form method="POST">

            <input type="text"
                   name="name"
                   placeholder="Enter your name"
                   required>

            <br><br>

            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <br><br>

            <input type="password"
                   name="password"
                   placeholder="Enter password"
                   required>

            <br><br>

            <button type="submit" class="btn">
                Register
            </button>

        </form>

    </section>

</body>

</html>
